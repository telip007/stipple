name: Feature request
description: Missing Ink behaviour, a convenience API or a SwiftUI analogue
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: For an Ink feature, link its docs or source. For an API, name the SwiftUI analogue if there is one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API (optional)
      render: swift
