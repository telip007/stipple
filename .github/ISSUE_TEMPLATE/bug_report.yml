name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a minimal view that reproduces it, and any error or garbled output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If Ink behaves differently, say how.
  - type: input
    id: swift
    attributes:
      label: Swift version and OS
      placeholder: Swift 6.2, macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator and TERM
      placeholder: Ghostty 1.2, TERM=xterm-ghostty (or iTerm2, kitty, Terminal.app, tmux, ssh…)
    validations:
      required: true
