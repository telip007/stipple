name: Release Please

# Keeps an open "chore: release x.y.z" PR that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging it tags the release and
# publishes the GitHub release. See wiki/concepts/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
